[plugin]
id = "herdr-codebuddy"
name = "CodeBuddy Integration"
description = "Manages CodeBuddy hooks and reports agent state/session information for Herdr"
version = "0.1.0"

[plugin.metadata]
min_herdr_version = "0.9.2"
supported_platforms = ["darwin", "linux"]
# supported_platforms = ["darwin", "linux", "windows"]  # Windows pending Git Bash quoting verification

[plugin.actions]
install-hooks = "scripts/manage_hooks.js install"
remove-hooks = "scripts/manage_hooks.js remove"
status = "scripts/manage_hooks.js status"

[plugin.startup]
enabled = false
# Set to true to auto-install hooks on Herdr startup; users can explicitly invoke /hooks install instead