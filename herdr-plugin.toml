id = "herdr-codebuddy"
name = "CodeBuddy Integration"
version = "0.1.0"
min_herdr_version = "0.9.2"
description = "Manages CodeBuddy hooks and reports agent state/session information for Herdr"
platforms = ["macos", "linux"]
# Add "windows" after Git Bash quoting has been verified.

[[actions]]
id = "install-hooks"
title = "Install CodeBuddy hooks"
command = ["node", "scripts/manage_hooks.js", "install"]

[[actions]]
id = "remove-hooks"
title = "Remove CodeBuddy hooks"
command = ["node", "scripts/manage_hooks.js", "remove"]

[[actions]]
id = "status"
title = "Check CodeBuddy hook status"
command = ["node", "scripts/manage_hooks.js", "status"]
